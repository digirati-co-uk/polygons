name: Release NPM package

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/next')
    uses: ./.github/workflows/build-test.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11
      - run: pnpm --filter polygons-core build
      - run: pnpm docs:check

      - name: Validate release version
        id: version
        working-directory: packages/polygons-core/npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Git tag must match packages/polygons-core/npm/package.json (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'tag=next' >> "$GITHUB_OUTPUT"
          else
            echo 'tag=latest' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm trusted publishing
        working-directory: packages/polygons-core/npm
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: npm publish --access public --tag "$RELEASE_TAG"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          args=()
          if [ "$RELEASE_TAG" = next ]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" --generate-notes "${args[@]}"
