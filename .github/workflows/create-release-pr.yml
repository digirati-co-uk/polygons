name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      semver:
        description: Version bump (current uses the version already prepared in package.json)
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - name: Prepare package version
        id: version
        working-directory: packages/polygons-core/npm
        env:
          SEMVER: ${{ inputs.semver }}
        run: |
          if [ "$SEMVER" != current ]; then
            npm version "$SEMVER" --no-git-tag-version --ignore-scripts --package-lock=false --workspaces=false
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"
          node scripts/prepare-release-notes.mjs "$VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Open draft release PR
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: release/next
          draft: true
          delete-branch: true
          add-paths: |
            packages/polygons-core/npm/package.json
            CHANGELOG.md
          commit-message: 'Release v${{ steps.version.outputs.version }}'
          title: 'Release v${{ steps.version.outputs.version }}'
          body-path: ${{ runner.temp }}/release-notes.md
